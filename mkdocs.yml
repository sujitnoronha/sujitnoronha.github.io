site_name: Sujit Noronha
site_description: ML Engineer | Voice AI | LLM Post-Training | Inference Optimization | Evals
site_author: Sujit Noronha
site_url: https://sujitnoronha.github.io

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/waveform
  palette:
    # Light mode (default)
    - scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - blog

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sujitnoronha
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/sujitnoronha

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - About: about.md
  - Projects: projects.md
  - Blog: blog/index.md
  - Updates: updates.md
  - Contact: contact.md
